[package]
name = "discord-send-notifier"
version = "0.1.2"
edition = "2024"
description = "軽量な単一バイナリの Discord Webhook 通知 CLI（Python/インタプリタ起動不要）"
license = "MIT"
repository = "https://github.com/densuke/discord-send-notifier-rs"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true

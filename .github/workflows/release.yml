name: release

# タグ push で各プラットフォームのバイナリをビルドし、GitHub Release に添付する。
#   git tag v0.1.3 && git push origin v0.1.3
# 実ビルド・リリース手順は再利用可能な build-release.yml に集約している（単一の真実）。
# 依存更新時の自動 patch リリース(auto-patch-release.yml)も同じ build-release.yml を呼ぶ。
#
# 生成物:
#   - discord-send-notifier-x86_64-linux-musl  … 支店/Linux(x86_64) 用・静的バイナリ
#   - discord-send-notifier-aarch64-macos      … 本店/macOS(Apple Silicon) 用

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  call-build-release:
    uses: ./.github/workflows/build-release.yml
    with:
      tag: ${{ github.ref_name }}
